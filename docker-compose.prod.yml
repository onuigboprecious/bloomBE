services:
  postgres:
    image: postgres:16-alpine
    container_name: nfc_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: nfc_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nfc_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: nfc_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/nfc_db?sslmode=disable
    ports:
      - "8080:8080"
      - "80:8080"

volumes:
  postgres_data:
